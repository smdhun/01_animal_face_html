<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <script>
    // 첫 그림이 그려지기 전에 저장된 화면 모드와 언어를 적용한다.
    (function () {
      try {
        var saved_theme = localStorage.getItem("theme_mode");
        document.documentElement.setAttribute("data-theme", saved_theme === "dark" ? "dark" : "light");
        var saved_language = localStorage.getItem("language_code") || "";
        var browser_language = (navigator.language || "").toLowerCase();
        var language_code = "ko";
        if (saved_language === "en" || saved_language === "ja" || saved_language === "ko") {
          language_code = saved_language;
        } else if (browser_language.indexOf("ja") === 0) {
          language_code = "ja";
        } else if (browser_language.indexOf("en") === 0) {
          language_code = "en";
        }
        document.documentElement.lang = language_code;
        document.documentElement.setAttribute("data-language", language_code);
      } catch (error) {
        document.documentElement.setAttribute("data-theme", "light");
        document.documentElement.lang = "ko";
        document.documentElement.setAttribute("data-language", "ko");
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google-adsense-account" content="ca-pub-8803401825336300" />
  <meta name="theme-color" content="#f4f1ea" />
  <meta name="description" data-i18n-content="contact_meta" content="동물상 도감의 제휴, 오류, 개인정보 질문을 받는 문의 페이지입니다." />
  <title data-i18n="contact_title">문의 — 동물상 도감</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8803401825336300" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="guide.css" />
</head>
<body data-title-key="contact_title">
  <main class="sheet">
    <div class="theme_bar">
      <div class="language_switch theme_switch" role="group" data-i18n-aria="language_group" aria-label="언어">
        <button type="button" class="theme_button" id="button_language_ko" data-language="ko">한국어</button>
        <button type="button" class="theme_button" id="button_language_en" data-language="en">English</button>
        <button type="button" class="theme_button" id="button_language_ja" data-language="ja">日本語</button>
      </div>
      <div class="theme_switch" role="group" data-i18n-aria="theme_group" aria-label="화면 모드">
        <button type="button" class="theme_button is_selected" id="button_theme_light" data-i18n="theme_light" aria-pressed="true">화이트</button>
        <button type="button" class="theme_button" id="button_theme_dark" data-i18n="theme_dark" aria-pressed="false">다크</button>
      </div>
    </div>
    <nav class="site_nav" data-i18n-aria="nav_label" aria-label="도감 메뉴">
      <a href="index.html" data-i18n="nav_tool">얼굴 재기</a>
      <a href="method.html" data-i18n="nav_method">측정 방법</a>
      <a href="about.html" data-i18n="nav_about">소개</a>
      <a href="privacy.html" data-i18n="nav_privacy">개인정보</a>
      <a href="contact.html" data-i18n="nav_contact" aria-current="page">문의</a>
    </nav>
    <article class="prose">
      <p class="eyebrow">Face Field Notes</p>
      <h1 data-i18n="contact_h1">문의</h1>
      <p data-i18n="contact_help">제휴, 오류, 개인정보 질문을 남겨 주세요. 얼굴 사진은 이 폼에 붙지 않습니다. 답변은 적어 주신 이메일로 갑니다.</p>
      <form id="contact_form" class="partner_form" action="https://formspree.io/f/xqppylkl" method="POST">
        <label class="partner_field">
          <span data-i18n="contact_name">이름</span>
          <input type="text" name="이름" required maxlength="80" autocomplete="name" />
        </label>
        <label class="partner_field">
          <span data-i18n="contact_company">회사 또는 브랜드</span>
          <input type="text" name="회사" maxlength="120" autocomplete="organization" />
        </label>
        <label class="partner_field">
          <span data-i18n="contact_email">답장 받을 이메일</span>
          <input type="email" name="email" required maxlength="120" autocomplete="email" inputmode="email" />
        </label>
        <label class="partner_field">
          <span data-i18n="contact_message">문의 내용</span>
          <textarea name="문의" required maxlength="2000" rows="5"></textarea>
        </label>
        <input type="hidden" name="_subject" data-i18n-value="contact_subject" value="동물상 도감 문의" />
        <input class="partner_gotcha" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <button type="submit" class="button_primary" id="contact_send" data-i18n="contact_send">문의 보내기</button>
        <p id="contact_status" class="contact_status" role="status"></p>
      </form>
    </article>
    <nav class="site_nav footer_nav" data-i18n-aria="nav_label" aria-label="도감 메뉴">
      <a href="index.html" data-i18n="nav_tool">얼굴 재기</a>
      <a href="method.html" data-i18n="nav_method">측정 방법</a>
      <a href="about.html" data-i18n="nav_about">소개</a>
      <a href="privacy.html" data-i18n="nav_privacy">개인정보</a>
      <a href="contact.html" data-i18n="nav_contact" aria-current="page">문의</a>
    </nav>
    <p class="footer_note" data-i18n="footer">사진은 이 브라우저 안에서만 처리되고 서버로 전송되지 않습니다. 결과는 얼굴 비율을 동물별 기준과 견준 재미있는 비교이며, 과학적 판별이나 성격 테스트가 아닙니다. 표정, 고개 각도, 안경, 조명에 따라 순위가 달라질 수 있어요.</p>
  </main>
  <script src="guide.js"></script>
</body>
</html>
